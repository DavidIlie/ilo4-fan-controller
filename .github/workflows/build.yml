name: "build_deploy_app"

on:
    push:
        branches:
            - master

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: "Build App"
        runs-on: davidapps-linux-x64
        steps:
            - name: "Build:checkout"
              uses: actions/checkout@v7.0.1
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.2.0
            - name: Build and publish Docker image
              uses: docker/build-push-action@v7.3.0
              with:
                  context: .
                  push: true
                  tags: ghcr.io/davidilie/ilo4-fan-controller:latest
                  cache-from: type=gha,scope=ilo4-fan-controller
                  cache-to: type=gha,mode=max,scope=ilo4-fan-controller
    deploy_self:
        name: "Deploy"
        runs-on: davidapps-linux-x64
        needs: [build]
        steps:
            - name: "Set up kubectl"
              uses: azure/setup-kubectl@v5.1.0
            - name: "Set Kubernetes Context"
              uses: Azure/k8s-set-context@v5.0.1
              with:
                  method: kubeconfig
                  kubeconfig: ${{ secrets.KUBE_CONFIG }}
            - name: "Restart web deployment"
              run: kubectl rollout restart deploy ilo4-fan-controller -n internal
