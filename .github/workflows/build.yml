name: "build_deploy_app"

on:
    push:
        branches:
            - master

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: "Build App"
        runs-on: davidapps-linux-x64
        steps:
            - name: "Build:checkout"
              uses: actions/checkout@v2
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v1
              with:
                  registry: ghcr.io
                  username: DavidIlie
                  password: ${{ secrets.GHCR_PASSWORD }}
            - name: Build and publish Docker image
              run: |
                  docker build -t ghcr.io/davidilie/ilo4-fan-controller .
                  docker push ghcr.io/davidilie/ilo4-fan-controller
    deploy_self:
        name: "Deploy"
        runs-on: davidapps-linux-x64
        needs: [build]
        steps:
            - name: "Set up kubectl"
              uses: azure/setup-kubectl@v4
            - name: "Set Kubernetes Context"
              uses: Azure/k8s-set-context@v1
              with:
                  method: kubeconfig
                  kubeconfig: ${{ secrets.KUBE_CONFIG }}
            - name: "Restart web deployment"
              run: kubectl rollout restart deploy ilo4-fan-controller -n internal
